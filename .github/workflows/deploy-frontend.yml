name: Deploy frontend a Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: Verificar versiones Next.js y OpenNext
        working-directory: frontend
        run: npm ls next @opennextjs/cloudflare

      - name: Build OpenNext
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://saas-catalogo-api.onrender.com
          NEXT_PUBLIC_TENANT_SLUG: javier
          NEXT_PUBLIC_DEMO: "false"
          NEXT_PUBLIC_SITE_URL: https://saas-catalogo-frontend.luisiking89.workers.dev
        run: npx @opennextjs/cloudflare build

      - name: Deploy a Cloudflare Workers
        working-directory: frontend
        run: npx wrangler deploy
